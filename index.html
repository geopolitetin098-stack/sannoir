<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Сан-Нуар</title>

<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0B14;--p1:#10121F;--p2:#161828;--p3:#1A1D30;--line:#2A2F4A;--line2:#1C1F33;--tx:#ECEEF7;--mu:#9AA0B8;--mu2:#6E7490;--pink:#FF3EA5;--pink2:#FF7CC3;--cyan:#3DE0FF;--orange:#FF8A3D;--gold:#FFC53D;--violet:#B57BFF;--red:#FF4D5E;--green:#3DDC97}
*{box-sizing:border-box}
html,body{margin:0;background:#05060C;color:var(--tx);font-family:Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.42;cursor:default}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
header{position:sticky;top:0;z-index:20;background:rgba(10,11,20,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line2);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:'Russo One',sans-serif;font-size:20px;letter-spacing:3px;color:var(--pink);text-shadow:0 0 10px rgba(255,62,165,.7),0 0 22px rgba(255,62,165,.35)}
.sub{font-size:11px;color:var(--mu);letter-spacing:.5px}
.bal{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:var(--p2);border:1px solid var(--line);font-weight:800;font-size:15px;white-space:nowrap}
main{flex:1;padding:14px 14px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(10,11,20,.97);border-top:1px solid var(--line2);display:grid;grid-template-columns:repeat(5,1fr);z-index:30}
nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--mu);position:relative}
nav button.on{color:var(--pink)}
nav svg{width:22px;height:22px}
.dot{position:absolute;top:8px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--pink);color:#1A0512;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column;gap:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.h1{font-family:'Russo One',sans-serif;font-size:22px}
.h2{font-weight:800;font-size:16px}
.mu{color:var(--mu)}.sm{font-size:12px}.xs{font-size:11px}
.lbl{font-size:11px;letter-spacing:1.4px;color:var(--mu);font-weight:800;text-transform:uppercase}
.stat{background:var(--p2);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:17px}
.btn{min-height:44px;border-radius:12px;border:none;padding:0 14px;font-weight:800;font-size:14px;background:var(--pink);color:#1A0512;box-shadow:0 0 14px rgba(255,62,165,.35)}
.btn.cy{background:var(--cyan);color:#04161C;box-shadow:0 0 14px rgba(61,224,255,.35)}
.btn.gh{background:var(--p2);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.or{background:transparent;color:var(--orange);border:1px solid var(--orange);box-shadow:none}
.btn.sm{min-height:36px;font-size:12.5px;padding:0 10px}
.btn.full{width:100%}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.6px;background:var(--p3);color:var(--mu)}
.bar{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--pink);box-shadow:0 0 8px var(--pink);transition:width .4s}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--p1);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--mu)}
.tabs button.on{border-color:var(--pink);color:var(--pink2);background:#241229}
.feed{padding:11px 13px;border-radius:14px;background:var(--p1);border:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
.led{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
.carc{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:3px;text-align:left;width:100%}
.carimg{height:74px;border-radius:10px;overflow:hidden;background:#0C0E1A;display:flex;align-items:center;justify-content:center}
.carimg img{width:100%;height:100%;object-fit:cover}
.slot-empty{border:1px dashed var(--line);border-radius:14px;min-height:150px;display:flex;align-items:center;justify-content:center;color:var(--mu2);font-size:12px}
.krax{display:flex;gap:8px;align-items:flex-end;padding:10px 12px 0 2px}
.bubble{font-size:13.5px;line-height:1.4;padding:10px 12px;border-radius:4px 14px 14px 14px;background:var(--p3)}
input[type=number],input[type=text],select{width:100%;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--p2);padding:0 12px;font-size:15px}
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(3,4,10,.72)}
#modal.on{display:flex}
#sheet{width:100%;max-width:430px;max-height:88vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;padding:18px 16px 26px;display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:70;max-width:400px;width:calc(100% - 28px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
#toast div{background:#1E2236;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#dev{position:fixed;right:max(10px,calc(50% - 205px));bottom:calc(78px + env(safe-area-inset-bottom));z-index:40}
#devbtn{border:1px solid var(--line);background:#14172A;color:var(--cyan);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800}
#devpanel{display:none;position:absolute;right:0;bottom:44px;width:250px;background:#121528;border:1px solid var(--line);border-radius:14px;padding:12px;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#devpanel.on{display:flex}
.flicker{animation:fl 4s infinite}
@keyframes fl{0%,100%{opacity:1}47%{opacity:.85}48%{opacity:.35}50%{opacity:.95}52%{opacity:.5}54%{opacity:1}}
.blink{animation:bl 1.4s infinite}@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.shake{animation:sh .35s ease-in-out infinite;transform-origin:50% 85%}@keyframes sh{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.pop{animation:pp .35s ease-out}@keyframes pp{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.rain{animation:rn 1.2s linear infinite}@keyframes rn{from{transform:translateY(-60px)}to{transform:translateY(200px)}}
.warn{background:#2A1416;border:1px solid #5A2228;color:#FFB3BB;border-radius:12px;padding:10px 12px;font-size:13px}
.ok{color:var(--green)}.bad{color:var(--red)}
.pl{display:inline-block;padding:3px 9px;border-radius:8px;font-size:13px;font-weight:800;white-space:nowrap}
.pl.up{background:rgba(61,220,151,.16);color:#5BF0AE;box-shadow:0 0 10px rgba(61,220,151,.25)}.pl.dn{background:rgba(255,77,94,.16);color:#FF6B79;box-shadow:0 0 10px rgba(255,77,94,.25)}
.stat .pl{align-self:flex-start;margin-top:2px;font-size:12px;padding:2px 7px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}.seg button{background:transparent;color:var(--mu);border:0;padding:8px 12px;font-weight:800;font-size:13px}.seg button.on{background:var(--cyan);color:#06121A}
.btn.xs2{padding:6px 10px;font-size:12px;min-height:0}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t td{padding:6px 4px;border-bottom:1px solid var(--line2)}
.spark{width:100%;height:46px}
.hidden{display:none!important}
</style>
</head>

function tgInit(){if(!TG)return;try{TG.ready();TG.expand();if(tgv('6.1')){TG.setHeaderColor('#0A0B14');TG.setBackgroundColor('#0A0B14')}if(tgv('7.7')&&TG.disableVerticalSwipes)TG.disableVerticalSwipes();if(tgv('6.1'))TG.BackButton.onClick(()=>{if(ui.modal&&!['collateral','opening'].includes(ui.modal.k)){ui.modal=null;render()}})}catch(e){}}
function tgBack(){try{if(TG&&tgv('6.1')){const on=!!(ui.modal&&!['collateral','opening'].includes(ui.modal.k));on?TG.BackButton.show():TG.BackButton.hide()}}catch(e){}}
// Облако Telegram: значение ключа — до 4096 символов, поэтому состояние режется на части
const CS=()=>TG&&tgv('6.9')?TG.CloudStorage:null;
const CHUNK=4000;
let cloudTimer=0,cloudBusy=false,cloudReady=false,freshState=false;
function packState(){return JSON.stringify(S,(k,v)=>typeof v==='number'&&!Number.isInteger(v)?Math.round(v*100)/100:v)}
function cloudSave(){const cs=CS();if(!cs||cloudBusy||!cloudReady)return;cloudBusy=true;try{const j=packState();const n=Math.ceil(j.length/CHUNK);let left=n+1,fail=false;
 const done=e=>{if(e)fail=true;if(--left===0){cloudBusy=false}};
 for(let i=0;i<n;i++)cs.setItem('st_'+i,j.slice(i*CHUNK,(i+1)*CHUNK),done);
 cs.setItem('st_meta',JSON.stringify({n,at:S.savedAt||Date.now(),v:S.v}),done)}catch(e){cloudBusy=false}}
function cloudSaveSoon(){if(!cloudTimer)cloudTimer=setTimeout(()=>{cloudTimer=0;cloudSave()},8000)}
function cloudLoad(cb){const cs=CS();if(!cs)return cb(null);try{cs.getItem('st_meta',(e,m)=>{if(e||!m)return cb(null);let meta;try{meta=JSON.parse(m)}catch(x){return cb(null)}if(!meta.n||meta.v!==4)return cb(null);
 const keys=Array.from({length:meta.n},(_,i)=>'st_'+i);cs.getItems(keys,(e2,vals)=>{if(e2||!vals)return cb(null);try{const j=keys.map(k=>vals[k]||'').join('');const o=JSON.parse(j);cb(o&&o.v===4?o:null)}catch(x){cb(null)}})})}catch(e){cb(null)}}
function catchUp(){if(!S.savedAt)return;const gone=Math.floor((Date.now()-S.savedAt)/1000);if(gone<60)return;const m=Math.min(gone,1440);advance(m);toast(`Пока вас не было, в городе прошло ${dur(m)}`)}
function save(){S.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudSaveSoon()}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===4)return o}}catch(e){}return null}

/* ============ ВЫЧИСЛЕНИЯ ============ */
const myCars=loc=>S.cars.filter(c=>!loc||c.loc===loc);
const garage=()=>myCars('garage');
const stock=()=>myCars('stock');
function setBonus(brand){const s=SETS.find(x=>x.brand===brand);if(!s)return 0;const own=new Set(S.cars.map(c=>c.id));return s.ids.every(i=>own.has(i))?.1:0}
function carInc(c){if(c.loc!=='garage'||c.lock==='delivery')return 0;const car=CAR[c.id];return car.inc*(1+setBonus(car.brand))}
function incomeH(){return garage().reduce((s,c)=>s+carInc(c),0)}
function friendInc(){return S.friends.filter(f=>f.rank>=1&&S.t<f.passiveTo).length*10}
function safeCap(){return (incomeH()+friendInc())*SAFE_H}
function rankIdx(){let i=0;RANKS.forEach((r,k)=>{if(S.rep>=r.rep)i=k});return i}
function debt(){return S.loan?Math.round(S.loan.debt):0}
function avail(){return S.bal-S.holds}
function own(){return avail()-(S.loan?S.loan.principal:0)}
function jailed(){return S.jail>S.t}
function setKrax(m,t){S.krax={m,t}}
function bump(k,n){if(S.cday!==dayOf(S.t)){S.cnt={};S.cday=dayOf(S.t)}S.cnt[k]=(S.cnt[k]||0)+(n||1);if(['collect','open','expoReg','bid','rumor'].includes(k))S.tutProg=S.tutProg||{};S.tutProg=S.tutProg||{};S.tutProg[k]=(S.tutProg[k]||0)+(n||1)}
function cnt(k){return S.cday===dayOf(S.t)?(S.cnt[k]||0):0}
function addRep(n){const before=rankIdx();S.rep=Math.max(0,S.rep+n);const after=rankIdx();if(after>before){toast(`Новый ранг: <b>${RANKS[after].n}</b>`);setKrax('happy',`Поздравляю, ты теперь ${RANKS[after].n}. Босс заметил. Это хорошо… наверное.`)}}
function pay(n){S.bal-=n}
function earn(n){S.bal+=n}
function reward(n){if(S.loan&&S.loan.workoff){const k=Math.min(n,S.loan.debt);S.loan.debt-=k;n-=k;if(k>0)toast(`${N(k)} ушли в счёт долга`);if(S.loan.debt<=0.5){toast('Долг отработан. Кракс доволен.');const lc=S.loan.u&&S.cars.find(x=>x.u===S.loan.u);if(lc)lc.lock=null;S.loan=null;setKrax('happy','Долг закрыт. Восемь рук, ноль паники.')}}S.bal+=n}
function news(txt,c){S.news.unshift({t:S.t,txt,c:c||'#3DE0FF'});S.news=S.news.slice(0,30)}
function placeCar(id,how){
 if(garage().length<5){S.cars.push(mkCar(S,id,'garage'));return 'garage'}
 if(stock().length<30){S.cars.push(mkCar(S,id,'stock'));return 'stock'}
 const p=cityPrice(id);earn(p);toast(`Склад полон: ${esc(CAR[id].name)} продана городу за ${N(p)}`);return 'sold'}
function rollBox(odds){let r=Math.random(),acc=0;for(const k of Object.keys(odds)){acc+=odds[k];if(r<acc)return pick(TIER[k]).id}return pick(TIER[Object.keys(odds)[0]]).id}

/* ============ ВРЕМЯ ============ */
function advance(mins){while(mins>0){const d=Math.min(mins,10);step(S.t,S.t+d);mins-=d}checkTasksDone();save()}
function crossed(t0,t1,mod,at){const a=Math.floor((t0-at)/mod),b=Math.floor((t1-at)/mod);return b>a}
function step(t0,t1){
 const dt=t1-t0;S.t=t1;
 // доход в сейф
 const cap=safeCap();if(S.safe<cap)S.safe=Math.min(cap,S.safe+(incomeH()+friendInc())*dt/60);
 if(crossed(t0,t1,1440,0))newDay();
 if(crossed(t0,t1,1440,19*60))closeExpoReg();
 if(crossed(t0,t1,1440,20*60))resolveExpo();
 auctions(t0,t1);
 if(crossed(t0,t1,30,0))stocksStep();
 S.stocks.forEach(s=>{if(s.ev&&s.ev.t<=t1)applyEvent(s)});
 if(crossed(t0,t1,60,0))market();
 S.deliveries=S.deliveries.filter(d=>{if(d.back<=t1){finishDelivery(d);return false}return true});
 S.phase+=dt*130;
 if(!S.finale&&t0<FINALE_T&&t1>=FINALE_T)runFinale();
 if(t1>=SEASON_DAYS*1440&&!S.inkShown){S.inkShown=true;ui.modal={k:'ink'}}
}
function newDay(){
 const d=dayOf(S.t);
 S.daily=rollDaily(d);S.wins={day:d,E:0,K:0};S.order=null;
 S.expo=newExpo(S,d);
 if(S.buyouts[d])news(`Выкуп Босса: сегодня Босс скупает ${CTY[S.buyouts[d].cty]} вдвое дороже цены города`,'#FFC53D');
 // клан и НПС-кланы
 S.clanPts+=rnd(6,14);
 S.npcClans.forEach(c=>{c.pts+=rnd(8,20);if(d>=10&&Math.random()<.25)c.clues=Math.min(4,c.clues+1)});
 // друзья растут
 S.friends.forEach(f=>{if(f.rank<1&&Math.random()<.45){f.rank=1;f.passiveTo=S.t+14*1440;earn(500);toast(`${esc(f.n)} дорос до Шестёрки: +500 Н и 10 Н/ч на 2 недели`)}});
 if(!S.friendBonus&&S.friends.filter(f=>f.rank>=1).length>=5){S.friendBonus=true;earn(2000);toast('Пять друзей стали Шестёрками: бонус 2 000 Н')}
 // долг
 if(S.loan&&!S.loan.workoff&&S.t>S.loan.due){
  S.loan.debt+=S.loan.principal*.05;
  if(!S.loan.warned){S.loan.warned=true;
   if(S.loan.kind==='small'){S.loan.workoff=true;setKrax('angry','Срок по долгу вышел. Теперь твои награды за задания идут Боссу, пока не отработаешь.');ui.modal={k:'krax',m:'angry',t:'Срок по долгу вышел. Малый долг отрабатываешь у меня: награды за задания пойдут в счёт долга, пока всё не закроешь.'}}
   else{ui.modal={k:'collateral'};setKrax('angry','Залог или работа. Выбирай.')}}
 }
}

/* ============ АУКЦИОН ============ */
function auctions(t0,t1){
 ['E','K'].forEach(k=>{while(S.nextLot[k]<=t1+90){const st=S.nextLot[k];const b=BOXES[k];S.lots.push({id:S.lotN++,k,start:st,end:st+30,v:Math.round(k==='E'?rnd(3200,7500):rnd(8500,20000)),max:0,res:null});S.nextLot[k]+=b.every}});
 S.lots.forEach(l=>{if(!l.res&&l.end<=t1)resolveLot(l)});
 S.lots=S.lots.filter(l=>!(l.res&&l.end<t1-180));
}
function npcCur(l,t){const b=BOXES[l.k];return Math.round(b.start+(l.v-b.start)*clamp((t-l.start)/(30*.92),0,1))}
function lotPrice(l,t){const b=BOXES[l.k];const nc=npcCur(l,t);if(!l.max)return nc;if(l.max>nc)return Math.min(l.max,Math.max(b.start,nc+b.step));return Math.min(nc,Math.max(nc,l.max+b.step))}
function lotLeader(l,t){return l.max&&l.max>npcCur(l,t)?'you':'npc'}
function resolveLot(l){
 const b=BOXES[l.k];
 if(l.max){S.holds-=l.max;
  if(l.max>l.v&&S.wins[l.k]<1){const price=Math.min(l.max,Math.max(b.start,l.v+b.step));pay(price);S.wins[l.k]++;const id=rollBox(b.odds);const where=placeCar(id);l.res={win:true,price,id};
   ui.modal={k:'reveal',id,src:b.n,where,price};reactToCar(id);addRep(5);hap(CAR[id].r==='C'?'light':'ok')}
  else{l.res={win:false,price:l.v};toast(`Лот «${b.n}» №${l.id} ушёл другому игроку за ${N(l.v)}. Ставка возвращена.`)}}
 else l.res={win:false,price:l.v};
}
function bidLot(id,max){
 const l=S.lots.find(x=>x.id===id);if(!l||l.res)return;const b=BOXES[l.k];
 if(S.t<l.start||S.t>=l.end)return toast('Торги по лоту не идут');
 if(S.wins[l.k]>=1)return toast('Сегодня ты уже выиграл лот этого типа. Приходи завтра.');
 max=Math.round(max);const minB=lotPrice(l,S.t)+b.step;
 if(!(max>=minB))return toast(`Минимальная ставка — ${N(minB)}`);
 const extra=max-(l.max||0);
 if(extra>own())return toast(S.loan?'Не хватает своих денег: заёмные нуары нельзя тратить на контейнеры':'Не хватает нуаров для такой ставки');
 S.holds+=extra;l.max=max;bump('bid');
 setKrax('plotting',lotLeader(l,S.t)==='you'?`Ставка стоит. Автоставка будет перебивать других до ${N(max)}.`:'Тебя уже перебили. Подними максимум, если хочешь лот.');
 save();render();
}

/* ============ КОНТЕЙНЕРЫ ============ */
function openPort(){
 const b=BOXES.port;if(own()<b.price)return toast(S.loan?'Не хватает своих денег: заёмные нуары нельзя тратить на контейнеры':'Не хватает нуаров');
 pay(b.price);bump('open');addRep(2);ui.modal={k:'opening'};render();
 setTimeout(()=>{const id=rollBox(b.odds);const where=placeCar(id);reactToCar(id);hap(CAR[id].r==='C'?'light':'ok');ui.modal={k:'reveal',id,src:'Портовый',where};checkTasksDone();save();render()},1300);
}
function reactToCar(id){const r=CAR[id].r;
 if(r==='C')setKrax('calm','Обычная. Третья рука говорит — на запчасти сойдёт. Или на продажу.');
 else if(r==='R')setKrax('happy','Редкая! Босс одобряет. Почти.');
 else if(r==='E')setKrax('happy','Эпическая! Руки уже спорят, кто её поведёт.');
 else setKrax('scared','Легендарная… Тише. Если Босс узнает — заберёт себе.')}

/* ============ ГАРАЖ ============ */
function collect(){const g=Math.floor(S.safe);if(g<1)return;const tax=Math.round(g*TAX);S.safe-=g;earn(g-tax);bump('collect');setKrax('happy',`Забрал ${N(g-tax)}. Дань Боссу — ${N(tax)}. Восемь рук, ноль паники.`);checkTasksDone();save();render()}
function moveCar(u){const c=S.cars.find(x=>x.u===u);if(!c||c.lock)return;if(c.loc==='garage'){if(stock().length>=30)return toast('Склад полон');c.loc='stock'}else{if(garage().length>=5)return toast('В гараже 5 мест. Сначала уберите машину на склад.');c.loc='garage'}save();ui.modal=null;render()}
function sellCity(u){const c=S.cars.find(x=>x.u===u);if(!c||c.lock)return;if(CAR[c.id].r==='D')return toast('Мечту Босса городу не продают');const p=cityPrice(c.id);S.cars=S.cars.filter(x=>x!==c);S.listings=S.listings.filter(l=>l.u!==u);earn(p);bump('sellCity');toast(`${esc(CAR[c.id].name)} продана городу за ${N(p)}`);checkTasksDone();save();ui.modal=null;render()}

/* ============ ТОРГОВЛЯ ============ */
function market(){
 S.offers=S.offers.filter(o=>o.exp>S.t&&S.cars.some(c=>c.u===o.u&&!c.lock));
 if(S.cars.length&&Math.random()<.35&&S.offers.length<4){
  const c=pick(S.cars.filter(x=>!x.lock&&CAR[x.id].r!=='D'));
  if(c){const mp=marketPrice(c.id);
   if(Math.random()<.55)S.offers.push({id:S.lotN++,u:c.u,who:pick(NPCN),kind:'buy',money:Math.round(mp*rnd(.8,1.6)/10)*10,exp:S.t+6*60});
   else{const same=CARS.filter(x=>x.r===CAR[c.id].r&&x.id!==c.id&&x.r!=='D');const give=pick(same);const diff=Math.round((marketPrice(c.id)-marketPrice(give.id))*rnd(.6,1.2)/10)*10;S.offers.push({id:S.lotN++,u:c.u,who:pick(NPCN),kind:'swap',give:give.id,money:Math.max(0,diff),exp:S.t+6*60})}}}
 // продажи по объявлениям
 S.listings=S.listings.filter(l=>{const c=S.cars.find(x=>x.u===l.u);if(!c)return false;if(c.lock)return true;const mp=marketPrice(c.id);const ch=clamp(1.25-l.price/mp,.04,.85)*.5;if(Math.random()<ch){const fee=Math.round(l.price*.05);S.cars=S.cars.filter(x=>x!==c);earn(l.price-fee);S.stats.trades++;bump('trade');addRep(3);toast(`${pick(NPCN)} купил ${esc(CAR[c.id].name)} за ${N(l.price)}. Комиссия Боссу ${N(fee)}`);return false}return true});
}
function corridor(id){const mp=marketPrice(id);return [Math.round(mp*.5),Math.round(mp*3)]}
function acceptOffer(oid){
 const o=S.offers.find(x=>x.id===oid);if(!o)return;const c=S.cars.find(x=>x.u===o.u);if(!c||c.lock)return toast('Машина недоступна');
 const [lo,hi]=corridor(c.id);
 if(o.kind==='buy'){if(o.money<lo||o.money>hi)return toast('Цена вне коридора 50–300% рыночной — сделка запрещена');const fee=Math.round(o.money*.05);S.cars=S.cars.filter(x=>x!==c);earn(o.money-fee);toast(`Продано за ${N(o.money)}, комиссия Боссу ${N(fee)}`)}
 else{const fee=Math.round(o.money*.05);S.cars=S.cars.filter(x=>x!==c);const where=placeCar(o.give);if(o.money)earn(o.money-fee);toast(`Обмен: получена ${esc(CAR[o.give].name)}${o.money?' и '+N(o.money-fee):''}`+(where==='stock'?' (на склад)':''))}
 S.listings=S.listings.filter(l=>l.u!==c.u);S.offers=S.offers.filter(x=>x!==o);S.stats.trades++;bump('trade');addRep(3);setKrax('happy','Сделка с рук — лучшая сделка. Если не обманули.');checkTasksDone();save();render()}
function declineOffer(oid){S.offers=S.offers.filter(x=>x.id!==oid);save();render()}
function listCar(u,price){const c=S.cars.find(x=>x.u===u);if(!c||c.lock)return;const [lo,hi]=corridor(c.id);price=Math.round(price);if(!(price>=lo&&price<=hi))return toast(`Цена должна быть от ${N(lo)} до ${N(hi)}`);S.listings=S.listings.filter(l=>l.u!==u);S.listings.push({u,price});toast('Объявление выставлено. Покупатель найдётся быстрее, если цена ближе к рыночной.');ui.modal=null;save();render()}
function unlist(u){S.listings=S.listings.filter(l=>l.u!==u);save();render()}
function giftCar(u,fi){const c=S.cars.find(x=>x.u===u);const f=S.friends[fi];if(!c||!f||c.lock)return;S.cars=S.cars.filter(x=>x!==c);S.listings=S.listings.filter(l=>l.u!==u);S.gifts.push({t:S.t,id:c.id,to:f.n});bump('gift');addRep(4);toast(`${esc(CAR[c.id].name)} подарена: ${esc(f.n)}. Подарок записан на сервере.`);checkTasksDone();ui.modal=null;save();render()}
function inviteFriend(){const n=pick(NPCN)+'_'+Math.floor(rnd(10,99));S.friends.push({n,rank:0,joined:S.t,passiveTo:0});toast(`${esc(n)} пришёл по вашей ссылке. Бонус — когда дорастёт до Шестёрки.`);save();render()}
function buyRumorBuyout(){const d=dayOf(S.t)+1;const b=S.buyouts[d];if(!b)return;if(own()<300&&avail()<300)return toast('Не хватает нуаров');pay(300);const truth=Math.random()<.8;const claimed=truth?b.cty:pick(Object.keys(CTY).filter(k=>k!==b.cty));S.rumors.buy[d]={claim:claimed,truth,checked:false};bump('rumor');setKrax('plotting',`Щёлк шепчет: завтра Босс будет скупать ${CTY[claimed]}. Слух не подтверждён.`);checkTasksDone();save();render()}
function verifyBuyout(){const d=dayOf(S.t)+1;const r=S.rumors.buy[d];if(!r||r.checked)return;if(avail()<200)return toast('Не хватает нуаров');pay(200);r.checked=true;bump('verify');setKrax(r.truth?'happy':'angry',r.truth?'Шип сдулся — слух правдивый.':'Шип раздулся! Слух ложный.');checkTasksDone();save();render()}
function sellBoss(u){const d=dayOf(S.t);const b=S.buyouts[d];const c=S.cars.find(x=>x.u===u);if(!b||!c||c.lock)return;if(CAR[c.id].cty!==b.cty)return toast('Босс сегодня скупает другие машины');if(b.sold>=3)return toast('Больше 3 машин Боссу за один выкуп не продать');const p=cityPrice(c.id)*2;S.cars=S.cars.filter(x=>x!==c);S.listings=S.listings.filter(l=>l.u!==u);b.sold++;earn(p);addRep(3);toast(`Босс купил ${esc(CAR[c.id].name)} за ${N(p)}`);save();render()}

/* ============ ВЫСТАВКА ============ */
function regOpen(){return tod(S.t)<19*60&&!S.expo.done}
function toggleExpo(u){const e=S.expo;if(!regOpen())return toast('Запись закрыта');if(jailed())return toast('Пока ты в тюрьме, выставки без тебя');const c=S.cars.find(x=>x.u===u);if(!c)return;if(c.lock&&c.lock!=='expo')return toast('Машина занята');
 if(e.entries.includes(u)){e.entries=e.entries.filter(x=>x!==u);c.lock=null}else{if(e.entries.length>=3)return toast('Не больше 3 машин на выставке');e.entries.push(u);c.lock='expo';if(e.entries.length===1){bump('expoReg');checkTasksDone()}}save();render()}
function setGuard(i){const e=S.expo;if(!regOpen())return;const g=GUARDS[i];if(g.rank&&rankIdx()<g.rank)return toast('Крыша Босса доступна с ранга Бригадир');const back=GUARDS[e.guard].cost;if(avail()+back<g.cost)return toast('Не хватает нуаров');S.bal+=back;pay(g.cost);e.guard=i;save();render()}
function prepGang(size){const e=S.expo;if(!regOpen())return toast('Подготовку надо закончить до 19:00');if(e.gang)return;if(jailed())return toast('Из тюрьмы банду не соберёшь');const cost=500+200*(size-1);if(avail()<cost)return toast('Не хватает нуаров');pay(cost);e.gang={size,cost};setKrax('plotting',`Банда из ${size} готова. Отменить уже нельзя — в 20:00 узнаем, что выставлено.`);save();render()}
function closeExpoReg(){}
function resolveExpo(){
 const e=S.expo;if(e.done)return;e.done=true;
 const mine=e.entries.map(u=>S.cars.find(c=>c.u===u)).filter(Boolean);const g=GUARDS[e.guard];
 const all=[...e.npc.map(n=>({...n,mine:false})),...mine.map(c=>({id:c.id,owner:'Вы',red:g.red,mine:true,u:c.u}))];
 const lines=[];let income=0;
 if(mine.length){income=Math.round(mine.reduce((s,c)=>s+CAR[c.id].pres,0)*6*(e.boss?1.5:1));earn(income);addRep(5)}
 // банды НПС
 const gangs=1+(Math.random()<.5?1:0);let robbed=0;
 for(let i=0;i<gangs;i++){const pool=all.filter(x=>!x.gone);if(!pool.length)break;const w=pool.map(x=>CAR[x.id].pres/(.25+x.red));let r=Math.random()*w.reduce((a,b)=>a+b,0),tgt=pool[0];for(let k=0;k<pool.length;k++){r-=w[k];if(r<=0){tgt=pool[k];break}}
  const ch=.45-tgt.red;if(Math.random()<ch){tgt.gone=true;robbed++;
   if(tgt.mine){S.cars=S.cars.filter(c=>c.u!==tgt.u);let comp='';if(e.guard===3){const cp=Math.round(cityPrice(tgt.id)*.5);earn(cp);comp=` Крыша Босса вернула ${N(cp)}.`}lines.push({c:'bad',t:`Банда «${pick(CLANS)}» угнала вашу ${CAR[tgt.id].name}.${comp}`});setKrax('sad','Твою машину угнали… Охрана была слабовата.')}
   else lines.push({c:'mu',t:`Банда угнала ${CAR[tgt.id].name} (владелец: ${tgt.owner}).`})}
  else lines.push({c:'mu',t:`Попытка ограбления сорвалась: ${CAR[tgt.id].name} под охраной.`})}
 if(robbed)bumpStock('cerb',.03*robbed,'Волна угонов на выставке: охрана в цене');
 // банда игрока
 if(e.gang){const pool=all.filter(x=>!x.mine&&!x.gone);if(pool.length){const w=pool.map(x=>CAR[x.id].pres);let r=Math.random()*w.reduce((a,b)=>a+b,0),tgt=pool[0];for(let k=0;k<pool.length;k++){r-=w[k];if(r<=0){tgt=pool[k];break}}
   const ch=clamp(.2+.1*e.gang.size-tgt.red,.05,.8);
   if(Math.random()<ch){tgt.gone=true;const where=placeCar(tgt.id);addRep(30);lines.push({c:'ok',t:`Ваша банда угнала ${CAR[tgt.id].name}${where==='sold'?' (склад полон — продана городу)':''}! Шанс был ${Math.round(ch*100)}%.`});setKrax('happy','Чистая работа. Я ничего не видел. Все восемь рук ничего не видели.')}
   else{S.jail=S.t+6*60;addRep(-10);let extra='';if(tgt.owner==='Босс'){addRep(-50);pay(Math.min(1000,Math.max(0,avail())));extra=' Это была машина Босса — месть: −50 репутации и штраф 1 000 Н.'}lines.push({c:'bad',t:`Ограбление ${CAR[tgt.id].name} провалилось. Тюрьма на 6 часов.${extra} Шанс был ${Math.round(ch*100)}%.`});setKrax('scared','Тебя взяли… Посиди тихо 6 часов. Босс будет недоволен.')}}}
 mine.forEach(c=>{const cc=S.cars.find(x=>x.u===c.u);if(cc)cc.lock=null});
 e.res={income,lines,all:all.map(x=>({id:x.id,owner:x.owner,gone:!!x.gone,mine:x.mine}))};
 S.lastExpo={...e.res,day:dayOf(S.t),boss:!!e.boss,took:mine.length>0||!!e.gang,robbed};
 if(mine.length||e.gang)ui.modal={k:'expoRes'};
 news(`Выставка ${e.boss?'Босса ':''}открылась: ${all.length} машин, угонов — ${robbed}`,'#FF3EA5');
}

/* ============ БИРЖА ============ */
function stocksStep(){S.stocks.forEach(s=>{s.p=Math.max(5,s.p*(1+gauss()*.012));s.h.push(s.p);s.h=s.h.slice(-48)})}
function applyEvent(s){const e=s.ev;const ch=e.dir*e.size;s.p=Math.max(5,s.p*(1+ch));s.h.push(s.p);s.h=s.h.slice(-48);const c=COMPANIES.find(x=>x.id===s.id);news(`${c.n}: ${e.k.toLowerCase()} — акции ${ch>0?'выросли':'упали'} на ${Math.abs(Math.round(ch*100))}%`,ch>0?'#3DDC97':'#FF4D5E');if(S.rumors.stock&&S.rumors.stock.id===s.id)S.rumors.stock=null;s.ev=planEvent(S.t)}
function bumpStock(id,pct,why){const s=S.stocks.find(x=>x.id===id);s.p*=1+pct;s.h.push(s.p);s.h=s.h.slice(-48);news(`${COMPANIES.find(c=>c.id===id).n} +${Math.round(pct*100)}%: ${why}`,'#3DDC97')}
function trade(id,q){const s=S.stocks.find(x=>x.id===id);q=Math.round(q);if(!(q>0))return;const pos=S.port[id]||{q:0,avg:0};
 if(q>0&&arguments[2]==='buy'){const cost=Math.round(s.p*q);if(avail()<cost)return toast('Не хватает нуаров');pay(cost);pos.avg=(pos.avg*pos.q+s.p*q)/(pos.q+q);pos.q+=q;S.port[id]=pos;bump('stockBuy');toast(`Куплено ${q} акц. за ${N(cost)}`)}
 else{if(pos.q<q)return toast('Столько акций нет');const got=Math.round(s.p*q);const pl=(s.p-pos.avg)*q;pos.q-=q;if(!pos.q)pos.avg=0;S.port[id]=pos;earn(got);S.stats.trades++;S.stats.pl+=pl;if(pl>0)S.stats.good++;toast(`Продано за ${N(got)} (${pl>=0?'+':''}${fmt(pl)} Н)`)}
 checkTasksDone();save();render()}
function buyStockRumor(){if(avail()<300)return toast('Не хватает нуаров');const s=[...S.stocks].sort((a,b)=>a.ev.t-b.ev.t)[0];const truth=Math.random()<.7;pay(300);S.rumors.stock={id:s.id,dir:truth?s.ev.dir:-s.ev.dir,truth,checked:false};bump('rumor');setKrax('plotting',`Щёлк шепчет: по «${COMPANIES.find(c=>c.id===s.id).n}» скоро новость, акции ${(truth?s.ev.dir:-s.ev.dir)>0?'пойдут вверх':'пойдут вниз'}. Не подтверждено.`);checkTasksDone();save();render()}
function verifyStock(){const r=S.rumors.stock;if(!r||r.checked)return;if(avail()<200)return toast('Не хватает нуаров');pay(200);r.checked=true;bump('verify');setKrax(r.truth?'happy':'angry',r.truth?'Шип сдулся: слух правдивый.':'Шип раздулся: слух ложный! Хорошо, что проверили.');checkTasksDone();save();render()}

/* ============ ДОЛГИ ============ */
function takeLoan(kind,u){if(S.loan)return toast('Пока долг не закрыт, новый не взять');
 if(kind==='small'){S.loan={kind,principal:2000,debt:2000,due:S.t+3*1440,workoff:false};earn(2000);setKrax('plotting','Босс дал 2 000 Н на 3 дня. Только не на контейнеры — это правило.')}
 else{const c=S.cars.find(x=>x.u===u);if(!c||c.lock)return;const amt=Math.round(marketPrice(c.id)*1.5/10)*10;c.lock='collateral';S.loan={kind,principal:amt,debt:amt,due:S.t+5*1440,workoff:false,u:c.u};earn(amt);setKrax('plotting',`Под залог ${CAR[c.id].name} — ${N(amt)} на 5 дней.`)}
 ui.modal=null;save();render()}
function repay(){if(!S.loan)return;const d=Math.ceil(S.loan.debt);if(avail()<d)return toast('Не хватает свободных нуаров, чтобы закрыть долг');pay(d);const c=S.loan.u&&S.cars.find(x=>x.u===S.loan.u);if(c)c.lock=null;S.loan=null;setKrax('happy','Долг закрыт. Босс доволен, а значит, и я жив.');save();render()}
function collateralChoice(give){const l=S.loan;if(!l)return;if(give){S.cars=S.cars.filter(c=>c.u!==l.u);S.loan=null;setKrax('sad','Залог ушёл Боссу. Зато чисто.')}else{l.workoff=true;const c=S.cars.find(x=>x.u===l.u);setKrax('angry','Будешь отрабатывать. Все награды за задания — в счёт долга. Залог пока у Босса.')}ui.modal=null;save();render()}

/* ============ ЗАДАНИЯ ============ */
function tutDone(t){return (S.tutProg&&S.tutProg[t.k]||0)>=t.need}
function claimTut(id){const t=TUT.find(x=>x.id===id);if(!t||S.tut[id]||!tutDone(t))return;S.tut[id]=true;reward(t.rw);addRep(t.rep);toast(`Задание «${t.n}»: +${N(t.rw)}, +${t.rep} реп.`);save();render()}
function dailyDone(id){const t=DAILY.find(x=>x.id===id);return cnt(t.k)>=t.need}
function claimDaily(id){if(jailed())return toast('Из тюрьмы награды не забрать');const t=DAILY.find(x=>x.id===id);if(!t||S.daily.claimed[id]||!dailyDone(id))return;S.daily.claimed[id]=true;reward(t.rw);addRep(t.rep);toast(`«${t.n}»: +${N(t.rw)}, +${t.rep} реп.`);
 if(S.daily.ids.every(i=>S.daily.claimed[i])&&!S.daily.bonus){S.daily.bonus=true;reward(300);toast('Все поручения дня выполнены: бонус 300 Н');setKrax('happy','Все три поручения закрыты. Пятая рука аплодирует.')}save();render()}
function checkTasksDone(){}
function startDelivery(u){if(rankIdx()<1)return toast('Перегоны — с ранга Шестёрка');if(jailed())return toast('Ты в тюрьме');const c=S.cars.find(x=>x.u===u);if(!c||c.lock||c.loc!=='garage')return toast('Нужна свободная машина из гаража');c.lock='delivery';S.deliveries.push({u,back:S.t+4*60,rw:Math.round(CAR[c.id].inc*4*3)});setKrax('plotting',`${CAR[c.id].name} ушла в перегон на 4 часа. Дохода с неё пока нет.`);ui.modal=null;save();render()}
function finishDelivery(d){const c=S.cars.find(x=>x.u===d.u);if(!c)return;if(Math.random()<.05){S.cars=S.cars.filter(x=>x!==c);const cp=Math.round(cityPrice(c.id)*.5);earn(cp);toast(`Перегон сорвался: ${esc(CAR[c.id].name)} перехватили. Босс компенсировал ${N(cp)}.`);setKrax('scared','Машину перехватили по дороге… Босс компенсировал половину.')}else{c.lock=null;reward(d.rw);addRep(20);toast(`Перегон ${esc(CAR[c.id].name)} завершён: +${N(d.rw)}, +20 реп.`)}}
function getOrder(){if(!S.order){const pool=CARS.filter(c=>c.r==='C'||c.r==='R');const c=pick(pool);S.order={id:c.id,rw:Math.round(marketPrice(c.id)*1.5/10)*10,done:false}}return S.order}
function fulfillOrder(){const o=getOrder();if(o.done)return;if(rankIdx()<2)return toast('Заказы Босса — с ранга Бригадир');const c=S.cars.find(x=>x.id===o.id&&!x.lock);if(!c)return toast('У тебя нет такой свободной машины');S.cars=S.cars.filter(x=>x!==c);o.done=true;reward(o.rw);addRep(30);toast(`Заказ выполнен: +${N(o.rw)}, +30 реп.`);setKrax('happy','Босс получил свою машину. Сегодня он почти улыбался.');save();render()}
function sabotage(){if(rankIdx()<3)return toast('Срыв сделок — с ранга Авторитет');if(jailed())return toast('Ты в тюрьме');if(S.sabotage===dayOf(S.t))return toast('Одна такая операция в день');if(avail()<1000)return toast('Нужно 1 000 Н на подготовку');pay(1000);S.sabotage=dayOf(S.t);if(Math.random()<.6){reward(3000);addRep(60);toast('Сделка конкурента сорвана: +3 000 Н, +60 реп.');setKrax('happy','Конкуренты в ярости. Босс в восторге.')}else{S.jail=S.t+6*60;addRep(-20);toast('Провал. Тюрьма на 6 часов, −20 реп.');setKrax('scared','Нас ждали… Сиди тихо.')}save();render()}
function scout(id){if(jailed())return toast('Ты в тюрьме');if(S.t>=FINALE_T)return toast('Сделка уже прошла');if((S.scoutCd[id]||0)>S.t)return toast('Это задание снова доступно через '+dur(S.scoutCd[id]-S.t));if(avail()<400)return toast('Нужно 400 Н');pay(400);S.scoutCd[id]=S.t+6*60;bump('scout');const s=SCOUT.find(x=>x.id===id);
 if(Math.random()<.6&&S.clues[id]<3){S.clues[id]++;addRep(10);toast(`Зацепка «${s.clue}» +1`);setKrax('plotting',`Есть зацепка: ${s.clue.toLowerCase()}. Клан стал ближе к мечте Босса.`)}else{toast('Ничего не удалось узнать');setKrax('sad','Пусто. Попробуем позже.')}checkTasksDone();save();render()}
function contribute(){if(avail()<1000)return toast('Нужно 1 000 Н');pay(1000);S.clanContrib+=1000;addRep(5);toast('Вклад в клан: 1 000 Н');save();render()}
function mug(){const d=dayOf(S.t);if(S.mugDay&&d-S.mugDay<3)return;if(avail()<100)return toast('Нужно 100 Н');pay(100);S.mugDay=d;addRep(25);setKrax('happy','Новая кружка! Теперь чай не проливается, когда Босс говорит «захватить мир».');save();render()}
function clanScore(){const c=S.clues;return S.clanPts+(c.place+c.time+c.guard+c.route)*15+S.clanContrib*3/200}
function clanReady(){return Object.values(S.clues).every(v=>v>=1)}

/* ============ ФИНАЛ И ВАЙП ============ */
function runFinale(){
 const cands=[];if(clanReady())cands.push({n:'Неоновые (ваш клан)',pts:clanScore(),me:true});
 S.npcClans.forEach(c=>{if(c.clues>=4)cands.push({n:c.n,pts:c.pts})});
 let win=null;if(cands.length){const w=cands.map(c=>c.pts*c.pts);let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<cands.length;i++){r-=w[i];if(r<=0){win=cands[i];break}}win=win||cands[cands.length-1]}
 S.finale={win:win?win.n:null,me:!!(win&&win.me),cands:cands.map(c=>({n:c.n,pts:Math.round(c.pts)}))};
 if(win&&win.me){placeCar('noire');S.hof.push({s:S.season,t:'Клан «Неоновые» увёл мечту Босса'});setKrax('scared','Мы… увели мечту Босса. Он будет искать виновных. Я ничего не знаю.')}
 else if(win)setKrax('sad',`Клан «${win.n}» увёл мечту Босса. В следующем сезоне на них откроют охоту.`);
 else setKrax('calm','Ни один клан не собрал зацепки. Мечта осталась у Босса.');
 news(win?`Сделка Босса сорвана: машину увёл клан «${win.n}»`:'Сделка Босса прошла: мечта осталась у него','#FF4D5E');
 ui.modal={k:'finale'};
}
function newSeason(){const keep={hof:S.hof,hunted:!!(S.finale&&S.finale.me)};S=newState(S.season+1,keep);if(keep.hunted)setKrax('scared','Новый сезон. На нашем клане метка «В розыске у Босса». Доход от машины есть, но облавы будут.');ui.modal=null;ui.tab='city';save();render()}

function stockDefault(s){const mode=ui.qmode||'sum';const k=s.id+mode;ui.qv=ui.qv||{};if(ui.qv[k]==null)ui.qv[k]=mode==='sum'?Math.max(0,Math.min(1000,Math.floor(avail()))):10;return ui.qv[k]}

 ui.qv=ui.qv||{};ui.qv[id+mode]=v;const el=$('#q_'+id);if(el)el.value=v;const h=$('#h_'+id);if(h)h.textContent=stockHint(s)}

 <span class="xs mu">Все три поручения за день — бонус 300 Н${S.daily.bonus?' (получен)':''}.</span>
 <div class="lbl">Поручения Босса</div>
 ${row('Перегон','Отдай машину из гаража на 4 часа: пока она в пути, дохода с неё нет. Награда — тройной доход за это время. Риск перехвата 5%, Босс вернёт половину цены.',S.deliveries.length?'В пути: '+S.deliveries.map(d=>{const c=S.cars.find(x=>x.u===d.u);return c?esc(CAR[c.id].name)+' до '+hm(d.back):''}).join(', '):'','×3 дохода · +20 реп.',r<1?'<span class="xs mu">С ранга Шестёрка</span>':'<span class="xs mu">Запуск — из карточки машины в гараже</span>')}
 ${row('Заказ на модель',`Боссу нужна ${esc(CAR[o.id].name)} до конца дня.`,o.done?'Выполнен':'',`${N(o.rw)} · +30 реп.`,r<2?'<span class="xs mu">С ранга Бригадир</span>':o.done?'':`<button class="btn sm" data-act="order">Сдать машину</button>`)}
 ${row('Сорвать сделку конкурента','Подготовка 1 000 Н. Шанс 60%: награда 3 000 Н. Провал — тюрьма 6 часов.','','3 000 Н · +60 реп.',r<3?'<span class="xs mu">С ранга Авторитет</span>':`<button class="btn sm" data-act="sabotage" ${S.sabotage===dayOf(S.t)?'disabled':''}>Идти на дело</button>`)}
 <div class="lbl">Разведка сезона · зацепки к сделке Босса</div>
 ${SCOUT.map(s=>{const cd=(S.scoutCd[s.id]||0)>S.t;return row(s.n,`${s.d} Стоит 400 Н, удача 60%.`,`Зацепка «${s.clue}»: ${S.clues[s.id]}/3`,'+10 реп.',`<button class="btn sm" data-scout="${s.id}" ${cd||S.t>=FINALE_T?'disabled':''}>${cd?'Через '+dur(S.scoutCd[s.id]-S.t):'Пойти'}</button>`)}).join('')}
 <div class="lbl">Просьба Кракса</div>
 ${row('Новая кружка для Кракса','Старую он уронил, когда Босс сказал «захватить мир». Раз в 3 дня.','','+25 реп.',`<button class="btn or sm" data-act="mug" ${mugOk?'':'disabled'}>Купить кружку · 100 Н</button>`)}
 <button class="btn gh full" data-close>Закрыть</button>`}
function seasonHTML(){const d=dayOf(S.t);const c=S.clues;const ph=d<=14?0:d<=27?1:2;
 const rows=[{n:'Неоновые (ваш клан)',pts:clanScore(),ready:clanReady(),me:true},...S.npcClans.map(x=>({n:x.n,pts:x.pts,ready:x.clues>=4}))].sort((a,b)=>b.pts-a.pts);
 return `<span class="h1">Сезон ${S.season}: мечта Босса</span><span class="sm mu">Bugatti La Voiture Noire — «Чёрная машина». Финал: день 28, 21:00. Перехватить может только один клан.</span>
 <div class="grid3">${['Слухи · дни 1–14','Подготовка · 15–27','Финал · день 28'].map((n,i)=>`<div class="stat" style="${i===ph?'border:1px solid var(--pink)':''}"><span class="xs ${i===ph?'':'mu'}">${n}</span></div>`).join('')}</div>
 <section class="card"><b>Зацепки вашего клана</b><span class="xs mu">Чтобы участвовать в перехвате, нужна хотя бы одна зацепка каждого вида.</span>${SCOUT.map(s=>`<div class="between sm"><span>${s.clue}</span><span style="color:${c[s.id]?'var(--green)':'var(--mu)'}">${c[s.id]}/3</span></div>`).join('')}<button class="btn sm" data-act="tasks">К разведке</button></section>
 <section class="card"><b>Подготовка кланов</b>${rows.map(r=>`<div class="between sm"><span style="${r.me?'color:var(--pink2);font-weight:800':''}">${esc(r.n)}</span><span class="mu">${fmt(r.pts)} ${r.ready?'· все зацепки':''}</span></div>`).join('')}<span class="xs mu">Чем выше подготовка, тем больше шанс увести машину. Вклад 1 000 Н даёт клану 15 очков.</span><button class="btn gh sm" data-act="contribute">Вложить в клан · 1 000 Н</button></section>
 ${S.finale?`<section class="card"><b>Итог сделки</b><span class="sm">${S.finale.win?(S.finale.me?'Ваш клан увёл мечту Босса!':'Машину увёл клан «'+esc(S.finale.win)+'»'):'Мечта осталась у Босса'}</span></section>`:''}
 <button class="btn gh full" data-close>Закрыть</button>`}

/* ============ РЕНДЕР ============ */
function render(){
 if(!ui.modal&&S.loan&&S.loan.kind==='big'&&S.loan.warned&&!S.loan.workoff)ui.modal={k:'collateral'};
 header();renderNav();tgBack();
 const v={city:viewCity,garage:viewGarage,market:viewMarket,expo:viewExpo,stocks:viewStocks}[ui.tab];
 $('#main').innerHTML=v();
 const mh=modalHTML();$('#modal').classList.toggle('on',!!mh);$('#sheet').innerHTML=mh;
}
function live(){header();const el=document.querySelector('[data-live="safe"]');if(el)el.textContent=N(S.safe);const b=document.querySelector('[data-live="safebar"]');if(b)b.style.width=(safeCap()?clamp(S.safe/safeCap()*100,0,100):0)+'%'}

/* ============ СОБЫТИЯ ============ */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-car]');if(!t)return;
 const d=t.dataset;
 if(d.tab){hap('light');ui.tab=d.tab;ui.modal=null;render();window.scrollTo(0,0);return}
 if(d.sub){const [a,b]=d.sub.split(':');ui.sub[a]=b;render();return}
 if(d.car){ui.modal={k:'car',u:+d.car};render();return}
 if('close' in d){ui.modal=null;render();return}
 if(d.move)return moveCar(+d.move);
 if(d.sellcity)return sellCity(+d.sellcity);
 if(d.deliver)return startDelivery(+d.deliver);
 if(d.giftopen){ui.modal={k:'gift',u:+d.giftopen};render();return}
 if(d.gift){const [u,i]=d.gift.split(':');return giftCar(+u,+i)}
 if(d.list){const v=+($('#lp')||{}).value;return listCar(+d.list,v)}
 if(d.unlist)return unlist(+d.unlist);
 if(d.offer)return acceptOffer(+d.offer);
 if(d.decline)return declineOffer(+d.decline);
 if(d.bid){const v=+($('#bid'+d.bid)||{}).value;return bidLot(+d.bid,v)}
 if(d.boss)return sellBoss(+d.boss);
 if(d.guard)return setGuard(+d.guard);
 if(d.qmode){ui.qmode=d.qmode;render();return}
 if(d.qfill){const [id,f]=d.qfill.split(':');return stockFill(id,+f)}
 if(d.sellall){const pos=S.port[d.sellall];return pos&&pos.q?trade(d.sellall,pos.q,'sell'):null}
 if(d.buy||d.sell){const id=d.buy||d.sell;const s=S.stocks.find(x=>x.id===id);const v=+($('#q_'+id)||{}).value;const mode=ui.qmode||'sum';let q=stockQ(s,mode,v);
  if(d.sell){const pos=S.port[id]||{q:0};if(mode==='sum')q=Math.min(pos.q,Math.round(v/s.p))}
  if(!(q>0))return toast(mode==='sum'?'Сумма меньше цены одной акции':'Укажите количество');return trade(id,q,d.buy?'buy':'sell')}
 if(d.loan)return takeLoan('small');
 if(d.loanbig)return takeLoan('big',+d.loanbig);
 if(d.coll)return collateralChoice(d.coll==='give');
 if(d.tut)return claimTut(d.tut);
 if(d.daily)return claimDaily(d.daily);
 if(d.scout)return scout(d.scout);
 if(d.dev)return dev(d.dev);
 const a=d.act;if(!a)return;
 const map={collect,openPort,repay,gang:()=>prepGang(+($('#gangSize')||{}).value||1),rumorBuy:buyRumorBuyout,verifyBuy:verifyBuyout,rumorStock:buyStockRumor,verifyStock,order:fulfillOrder,sabotage,mug,contribute,invite:inviteFriend,newSeason,
  tasks:()=>{ui.modal={k:'tasks'};render()},season:()=>{ui.modal={k:'season'};render()},loans:()=>{ui.modal={k:'loans'};render()},friends:()=>{ui.modal={k:'friends'};render()},hof:()=>{ui.modal={k:'hof'};render()},expoRes:()=>{ui.modal={k:'expoRes'};render()},
  shareRef:()=>{const u=refLink(),t='Заходи в Сан-Нуар — город, где всё принадлежит Боссу.';const url='https://t.me/share/url?url='+encodeURIComponent(u)+'&text='+encodeURIComponent(t);try{if(TG)TG.openTelegramLink(url);else window.open(url,'_blank')}catch(e){toast('Не удалось открыть Telegram')}},
  copyRef:()=>{try{navigator.clipboard.writeText(refLink()).then(()=>toast('Ссылка скопирована'),()=>toast('Не удалось скопировать — выделите ссылку вручную'))}catch(err){toast('Не удалось скопировать')}}};
 if(map[a])map[a]();
});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.expo)toggleExpo(+d.expo)});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.qin){const s=S.stocks.find(x=>x.id===d.qin);ui.qv=ui.qv||{};ui.qv[d.qin+(ui.qmode||'sum')]=+e.target.value;const h=$('#h_'+d.qin);if(h)h.textContent=stockHint(s)}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&ui.modal&&!['collateral','opening'].includes(ui.modal.k)){ui.modal=null;render()}});
$('#devbtn').addEventListener('click',()=>$('#devpanel').classList.toggle('on'));
function dev(k){
 if(k==='money'){S.bal+=10000;toast('+10 000 Н (демо)')}
 else if(k==='reset'){S=newState(1);ui={tab:'city',sub:{market:'auction'},modal:null,speed:ui.speed};toast('Прогресс сброшен')}
 else if(k==='speed'){ui.speed=ui.speed===1?10:1;$('#speedBtn').textContent='Скорость ×'+ui.speed}
 else if(k==='to1855'){let m=(18*60+55-tod(S.t)+1440)%1440;if(!m)m=1440;advance(m)}
 else if(k==='toFinal'){if(S.t<FINALE_T-5)advance(FINALE_T-5-S.t);else toast('Финал уже прошёл')}
 else advance(+k);
 save();render();
}
/* ============ СТАРТ ============ */
tgInit();
const loaded=load();freshState=!loaded;S=loaded||newState(1);
catchUp();
render();
if(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.start_param&&/^ref_/.test(TG.initDataUnsafe.start_param)&&!S.refFrom){S.refFrom=TG.initDataUnsafe.start_param;toast('Вас пригласил друг. Добро пожаловать в Сан-Нуар!')}
cloudLoad(o=>{cloudReady=true;if(o&&(freshState||(o.savedAt||0)>(S.savedAt||0)+5000)){S=o;catchUp();save();render();toast('Прогресс загружен из облака Telegram')}else cloudSaveSoon()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){save();clearTimeout(cloudTimer);cloudTimer=0;cloudSave()}});
setInterval(()=>{const mk0=ui.modal&&ui.modal.k;advance(ui.speed);const mk1=ui.modal&&ui.modal.k;if(mk1&&mk1!==mk0)render();else live();
 // перерисовка экранов с таймерами раз в 5 игровых минут, если пользователь не печатает
 if(S.t%5===0&&!(document.activeElement&&['INPUT','SELECT'].includes(document.activeElement.tagName))&&(ui.tab==='market'||ui.tab==='stocks'||ui.tab==='expo'))render()},1000);
window.SN={get S(){return S},advance:m=>{advance(m);render()},render,newState:()=>{S=newState(1);render()}};
</script>
</body>
</html>
